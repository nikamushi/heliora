name: Mobile Release

on:
  push:
    tags:
      - "mobile-v*"
      - "v*-mobile"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (mobile-vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.name }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ "$TAG" =~ ^mobile-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-mobile$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "Tag must match mobile-vX.Y.Z or vX.Y.Z-mobile (got: $TAG)" >&2
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Log release configuration mode
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_API_URL: ${{ secrets.API_BASE_URL != '' }}
        run: |
          echo "Release build mode initialized."
          if [[ "$HAS_KEYSTORE" == "true" ]]; then
            echo "Keystore: Using repository secret ANDROID_KEYSTORE_BASE64."
          else
            echo "Keystore: Repository secret not configured, generating signed release keystore."
          fi
          if [[ "$HAS_API_URL" == "true" ]]; then
            echo "API URL: Using repository secret API_BASE_URL."
          else
            echo "API URL: Using canonical production endpoint (https://api.heliora.software)."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/.fvmrc
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Configure Keystore
        id: keystore
        working-directory: apps/mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          INPUT_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          INPUT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          INPUT_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          STORE_PASS="${INPUT_STORE_PASS:-heliora-ci-keystore-pass}"
          ALIAS="${INPUT_KEY_ALIAS:-heliora}"
          KEY_PASS="${INPUT_KEY_PASS:-$STORE_PASS}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from repository secrets..."
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          else
            echo "Generating dedicated release keystore for CI build..."
            keytool -genkey -v \
              -keystore android/app/upload-keystore.jks \
              -storepass "$STORE_PASS" \
              -alias "$ALIAS" \
              -keypass "$KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=HELIORA, OU=Mobile, O=Heliora Health, L=Jakarta, ST=DKI Jakarta, C=ID"
          fi
          test -s android/app/upload-keystore.jks

          echo "keystore_path=upload-keystore.jks" >> "$GITHUB_OUTPUT"
          echo "keystore_password=$STORE_PASS" >> "$GITHUB_OUTPUT"
          echo "key_alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "key_password=$KEY_PASS" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.keystore_password }}
          ANDROID_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          ANDROID_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://api.heliora.software' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vhrwtzenemkswivwhwmt.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZocnd0emVuZW1rc3dpdndod210Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTAzODcsImV4cCI6MjEwNDc4NjM4N30.r03LNmMnjL9X8prh93Suxzgr8KG0IGMCGjzeVWdv2T8' }}
        run: |
          flutter build apk --release --no-pub \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.build_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" 

      - name: Verify APK signature
        working-directory: apps/mobile
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          keytool -printcert -jarfile "$APK" > /dev/null
          # Gradle falls back to the debug keystore when release signing is
          # unavailable; a debug-signed APK must never be published.
          if keytool -printcert -jarfile "$APK" | grep -q "CN=Android Debug"; then
            echo "APK is debug-signed; refusing to publish." >&2
            exit 1
          fi
          echo "APK is signed with the release key."

      - name: Prepare release artifact
        working-directory: apps/mobile
        run: |
          mkdir -p ../../release-output
          APK="heliora-mobile-${{ steps.version.outputs.name }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "../../release-output/$APK"
          (cd ../../release-output && sha256sum "$APK" > "$APK.sha256")
          if [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md ../../release-output/RELEASE_NOTES.md
          fi
          ls -l ../../release-output

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-release-${{ steps.version.outputs.name }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mobile-release-${{ needs.build.outputs.version }}
          path: release-files
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: HELIORA Mobile v${{ needs.build.outputs.version }}
          body_path: release-files/RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-files/*
          fail_on_unmatched_files: true
