name: Mobile CI & Release Pipeline

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release?'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release tag'
        required: false
        type: string
        default: 'v0.1.0-mobile'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Mobile Code
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Unit & Widget Tests
        working-directory: apps/mobile
        run: flutter test --no-pub

  build-release-apk:
    name: Build Release APK
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Configure Keystore (If Provided in Secrets)
        id: keystore
        working-directory: apps/mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No custom release keystore provided; using default build configuration."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android Release APK
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.has_keystore == 'true' && 'upload-keystore.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://api.heliora.id' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vhrwtzenemkswivwhwmt.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZocnd0emVuZW1rc3dpdndod210Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTAzODcsImV4cCI6MjEwNDc4NjM4N30.r03LNmMnjL9X8prh93Suxzgr8KG0IGMCGjzeVWdv2T8' }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk release-output/heliora-app-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heliora-app-release
          path: release-output/heliora-app-release.apk
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release-apk
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: heliora-app-release
          path: release-files

      - name: Resolve Release Tag & Title
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          else
            TAG_NAME="v0.1.0-mobile"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_title=HELIORA Mobile $TAG_NAME (MVP Initial Release)" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_title }}
          files: release-files/heliora-app-release.apk
          draft: false
          prerelease: false
          body: |
            ## HELIORA Mobile MVP - Rilis Resmi Perdana

            Selamat datang di rilis perdana aplikasi mobile **HELIORA** untuk platform Android!

            ### Fitur Utama:
            - **Desain & Branding Otentik**: Menampilkan logo resmi Concept A (Helix-H), tema Figma *Mobile (MVP)* (Light & Dark), ikon adaptif Android, dan splash screen beranimasi 1 detik.
            - **Autentikasi & Sesi Aman**: Integrasi Supabase Auth dengan penyimpanan token terenkripsi di keychain/keystore perangkat (`flutter_secure_storage`).
            - **Persetujuan & Privasi (BR-CONSENT-001/003)**: Alur persetujuan pemrosesan data kesehatan 2-langkah dengan kepatuhan penolakan dan pencabutan persetujuan.
            - **Asesmen Profil Kesehatan (3-Tahap)**: Pengumpulan data dasar biologis, kalkulator BMI real-time, riwayat medis, dan aktivitas fisik.
            - **Estimasi Risiko & Simulasi What-if**: Visualisasi estimasi risiko kardiometabolik 10-tahun dan simulasi gaya hidup real-time.
            - **Desain Editorial & Anti-slop**: Mematuhi standar visual tanpa pill chip atau oval badge.

            ### Berkas Rilis:
            - Unduh file `heliora-app-release.apk` di bawah dan pasang pada perangkat fisik Android (Android 8.0 / API 26+).
