name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.nvmrc'
              - '.python-version'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
            api:
              - 'apps/api/**'
              - 'packages/ml-core/**'
              - 'ai/**'
            mobile:
              - 'apps/mobile/**'

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint --max-warnings=0

      - name: Typecheck
        run: pnpm --filter frontend typecheck

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm --filter frontend build

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: heliora
          POSTGRES_PASSWORD: heliora
          POSTGRES_DB: heliora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heliora -d heliora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      SECRET_KEY: ci-test-secret
      DATABASE_URL: postgresql+asyncpg://heliora:heliora@localhost:5432/heliora
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-extra notebook --all-groups

      - name: Lint
        run: uv run ruff check apps/api packages/ml-core/src ai/src

      - name: Check formatting
        run: uv run ruff format --check apps/api packages/ml-core ai

      - name: Validate database migrations
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: API tests
        working-directory: apps/api
        run: >
          uv run pytest tests -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=junit.xml

      - name: ML core tests
        working-directory: packages/ml-core
        run: uv run pytest tests -q

      - name: AI pipeline tests
        working-directory: ai
        run: uv run pytest tests -q

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-reports
          path: |
            apps/api/coverage.xml
            apps/api/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/.fvmrc
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      # Advisory until the Flutter workspace is reformatted in a dedicated change.
      - name: Check formatting (advisory)
        working-directory: apps/mobile
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: apps/mobile
        run: flutter test --coverage

      - name: Verify Android debug build
        working-directory: apps/mobile
        run: flutter build apk --debug --no-pub

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        continue-on-error: true
        with:
          fail-on-severity: high

  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, web, api, mobile, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize job results
        run: |
          {
            echo "### CI results"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Web | ${{ needs.web.result }} |"
            echo "| API | ${{ needs.api.result }} |"
            echo "| Mobile | ${{ needs.mobile.result }} |"
            echo "| Dependency review | ${{ needs['dependency-review'].result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
