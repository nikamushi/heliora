[project]
name = "heliora-ai"
version = "0.1.0"
description = "HELIORA — AI experiments: datasets, notebooks, pipelines (AI-001)"
requires-python = ">=3.12"
dependencies = [
    "ml-core",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pyarrow>=15.0.0",
    "joblib>=1.3.0",
]

[tool.uv.sources]
ml-core = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "jupytext>=1.16.0",
]
notebook = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heliora_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["datasets/dump"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
