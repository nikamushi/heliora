name: heliora_mobile
description: "HELIORA mobile app (Android)"
publish_to: 'none'

# versionName+versionCode for Android. Override with --build-name and --build-number.
version: 1.0.1+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.3
  flutter_secure_storage: ^9.2.4
  dio: ^5.7.0
  flutter_riverpod: ^3.4.3
  json_annotation: ^4.9.0
  shared_preferences: 2.5.6
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  go_router: ^17.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  swagger_parser: ^1.45.0
  build_runner: 2.7.2
  build_resolvers: 3.0.4
  source_gen: 4.2.4
  json_serializable: 6.11.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/icons/

