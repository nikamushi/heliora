[project]
name = "heliora-ml"
version = "0.1.0"
description = "HELIORA — dataset preprocessing & ML experiments (AI-001)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "jupytext>=1.16.0",
]
notebook = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heliora_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["notebooks"]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
